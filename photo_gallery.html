<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Photo Gallery Slider</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

<div class="container py-5">

  <h2 class="text-center mb-4">Photo Gallery</h2>

  <div id="photoGallery" class="carousel slide height-50" data-bs-ride="carousel" >

    <!-- Indicators -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#photoGallery"
              data-bs-slide-to="0" class="active"></button>

      <button type="button" data-bs-target="#photoGallery"
              data-bs-slide-to="1"></button>

      <button type="button" data-bs-target="#photoGallery"
              data-bs-slide-to="2"></button>
    </div>

    <!-- Images -->
    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="images/1.jpeg"
             class="d-block w-10"
             alt="Photo 1">
      </div>

      <div class="carousel-item">
        <img src="images/2.jpeg"
             class="d-block w-10"
             alt="Photo 2">
      </div>

      <div class="carousel-item">
        <img src="images/photo3.jpeg"
             class="d-block w-10"
             alt="Photo 3">
      </div>

    </div>

    <!-- Previous -->
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#photoGallery"
            data-bs-slide="prev">

      <span class="carousel-control-prev-icon"></span>
      <span class="visually-hidden">Previous</span>

    </button>

    <!-- Next -->
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#photoGallery"
            data-bs-slide="next">

      <span class="carousel-control-next-icon"></span>
      <span class="visually-hidden">Next</span>

    </button>

  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
