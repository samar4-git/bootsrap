<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bootstrap Photo Gallery Lightbox</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .gallery .card {
      overflow: hidden;
    }

    .gallery img:hover {
      transform: scale(1.08);
    }

    .lightbox-img {
      width: 100%;
      max-height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <div class="container py-5">

    <h2 class="text-center mb-4">Photo Gallery</h2>

    <div class="row g-4 ">

      <div class="col-lg-4 col-md-6">
        <div class="card">
          <div class="card">
            <img src="https://picsum.photos/id/1015/800/600" class="gallery-img" alt="Image 1" data-bs-toggle="modal"
              data-bs-target="#lightboxModal">
          </div>
        </div>
      </div>
      <div class="col-lg-4 col-md-6">
        <div class="card">
          <img src="https://picsum.photos/id/1016/800/600" class="gallery-img" alt="Image 2" data-bs-toggle="modal"
            data-bs-target="#lightboxModal">
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="card">
          <img src="https://picsum.photos/id/1025/800/600" class="gallery-img" alt="Image 3" data-bs-toggle="modal"
            data-bs-target="#lightboxModal">
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="card">
          <img src="https://picsum.photos/id/1035/800/600" class="gallery-img" alt="Image 4" data-bs-toggle="modal"
            data-bs-target="#lightboxModal">
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="card">
          <img src="https://picsum.photos/id/1043/800/600" class="gallery-img" alt="Image 5" data-bs-toggle="modal"
            data-bs-target="#lightboxModal">
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="card">
          <img src="https://picsum.photos/id/1069/800/600" class="gallery-img" alt="Image 6" data-bs-toggle="modal"
            data-bs-target="#lightboxModal">
        </div>
      </div>

    </div>
  </div>


  <!-- Lightbox Modal -->
  <div class="modal fade" id="lightboxModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-xl">

      <div class="modal-content bg-dark">

        <div class="modal-header border-0">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
          </button>
        </div>

        <div class="modal-body text-center position-relative">

          <!-- Previous -->
          <button class="btn btn-light position-absolute top-50 start-0 translate-middle-y" id="prevBtn">
            ❮
          </button>

          <!-- Large Image -->
          <img id="lightboxImage" src="" class="img-fluid lightbox-img" alt="Lightbox Image">

          <!-- Next -->
          <button class="btn btn-light position-absolute top-50 end-0 translate-middle-y" id="nextBtn">
            ❯
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    const images = document.querySelectorAll(".gallery-img");
    const lightboxImage = document.getElementById("lightboxImage");

    let currentIndex = 0;

    // Open image
    images.forEach((image, index) => {

      image.addEventListener("click", function () {

        currentIndex = index;

        lightboxImage.src = this.src;
        lightboxImage.alt = this.alt;

      });

    });


    // Next button
    document.getElementById("nextBtn").addEventListener("click", function () {

      currentIndex++;

      if (currentIndex >= images.length) {
        currentIndex = 0;
      }

      lightboxImage.src = images[currentIndex].src;
      lightboxImage.alt = images[currentIndex].alt;

    });


    // Previous button
    document.getElementById("prevBtn").addEventListener("click", function () {

      currentIndex--;

      if (currentIndex < 0) {
        currentIndex = images.length - 1;
      }

      lightboxImage.src = images[currentIndex].src;
      lightboxImage.alt = images[currentIndex].alt;

    });

  </script>

</body>

</html>
