<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<style>
    .bg {
        background-color: rgb(255, 82, 0);
        color: white;
    }

    .font {
        font-size: large;
    }

    .search-wrapper {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 30px;
    }

    .search-box {
        height: 60px;
        background: white;
        border-radius: 15px;
        display: flex;
        align-items: center;
        color: #686868;
    }

    .location-box {
        width: 302px;
        padding: 0 18px;
    }

    .location-icon {
        color: #ff5200;
        font-size: 22px;
        margin-right: 13px;
    }

    .location-text {
        white-space: nowrap;
        overflow: scroll;
        text-overflow: ellipsis;
        flex: 1;
        font-weight: 600;
    }

    .search-box-main {
        width: 485px;
        padding: 0 18px;
    }

    .search-box-main input {
        border: none;
        outline: none;
        flex: 1;
        font-size: 16px;
        color: #555;
    }

    .search-box-main input::placeholder {
        color: #777;
        font-weight: 500;
    }

    .search-icon {
        font-size: 20px;
        color: #555;
    }

    input::-moz-focus-inner {
        border: 0px;
    }
</style>

<body class="bg">

    <nav class="navbar  navbar-expand-lg mt-4">
        <div class="container">
            <ul class="navbar-nav ms-auto align-items-center gap-3">
                <li class="nav-item fw-bold"><a class="nav-link text-white" href="#">Swiggy Coperate</a></li>
                <li class="nav-item fw-bold"><a class="nav-link text-white" href="#">Partner With Us</a></li>
                <li class="nav-item fw-bold"><button class="btn btn-outline-light text-white">Get App</button></li>
                <li class="nav-item fw-bold"><button class="btn btn-primary">Sign In</button></li>

            </ul>
        </div>

    </nav>
    <div class="container ">
        <div class="row">
            <h1 class="m-5 text-center">Order food & groceries. Discover<br /> best restaurants. Swiggy it!</h1>


            <div class="search-wrapper">

                <!-- Location -->
                <div class="search-box location-box">
                    <i class="bi bi-geo-alt-fill"></i>
                    <input style="border: 0px; " class="form-control" type="text" name="locate" id="locate">
                    <i class="bi bi-chevron-down text-dark fs-5"></i>
                </div>


                <!-- Search -->
                <div class="search-box search-box-main">
                    <input type="text" name="" id="" placeholder="Search for restaurant, item or more">
                    <i class="bi bi-search"></i>
                </div>

            </div>

        </div>


        <div class="row justify-content-center">
            <div class="col-lg-4">
                <div class="card">
                    
                </div>
            </div>

            <!--card 2-->
            <div class="col-lg-4">
                <div class="card">
                   
                </div>
            </div>
            <!--card 3-->
            <div class="col-lg-4">
                <div class="card">
                    
                </div>
            </div>
        </div>
    </div>
</body>

</html>
