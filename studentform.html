<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Page</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <!-- Profile Card -->
                <div class="card shadow border-0">

                    <!-- Header -->
                    <div class="card-body text-center">

                        <!-- Profile Image -->
                        <img
                            src="images/1.jpeg"
                            class="rounded-circle mb-3"
                            width="150"
                            height="150"
                            alt="Profile"
                        >

                        <!-- Name -->
                        <h2 class="card-title mb-1">
                            Rahul Kumar
                        </h2>

                        <p class="text-muted">
                            DevOps Engineer
                        </p>

                        <!-- About -->
                        <p class="card-text">
                            Passionate DevOps engineer interested in Linux,
                            Docker, Kubernetes, AWS and CI/CD.
                        </p>

                        <!-- Buttons -->
                        <div class="mb-4">
                            <button class="btn btn-primary">
                                Follow
                            </button>

                            <button class="btn btn-outline-secondary">
                                Message
                            </button>
                        </div>

                        <hr>

                        <!-- Skills -->
                        <h5 class="text-start">Skills</h5>

                        <div class="text-start mb-4">
                            <span class="badge bg-primary">Linux</span>
                            <span class="badge bg-success">Docker</span>
                            <span class="badge bg-info text-dark">Kubernetes</span>
                            <span class="badge bg-warning text-dark">AWS</span>
                            <span class="badge bg-dark">Git</span>
                            <span class="badge bg-danger">Jenkins</span>
                        </div>

                        <!-- Profile Information -->
                        <div class="text-start">

                            <div class="row mb-2">
                                <div class="col-4 fw-bold">
                                    Location
                                </div>
                                <div class="col-8">
                                    India
                                </div>
                            </div>

                            <div class="row mb-2">
                                <div class="col-4 fw-bold">
                                    Email
                                </div>
                                <div class="col-8">
                                    rahul@example.com
                                </div>
                            </div>

                            <div class="row mb-2">
                                <div class="col-4 fw-bold">
                                    Experience
                                </div>
                                <div class="col-8">
                                    2 Years
                                </div>
                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
