<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Invitation</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

  
</head>
<style>
    .mobile-card {
            max-width: 430px;
            min-height: 100vh;
            background: #fff;
            margin: auto;
            overflow: hidden;
        }

         .detail-box {
            background: #fff5f8;
            border-radius: 18px;
            padding: 15px 8px;
            height: 100%;
        }
         .script-font {
            font-family: 'Great Vibes', cursive;
        }
</style>
<body>


    <div class="mobile-card">
         <!--celebrate section-->
        <div class="text-center">
            <div class="text-uppercase" style="letter-spacing:2px">
                <p>you're invited in</p>
            </div>
                <div class="script-font">
                <h1>Samar's Birthday</h1>
                </div>
                <p>Birthday Celebration 🎂</p>

                <div class="text-secondary">
                    <p>Come celebrate my special day with me!
                    There will be cake, music, laughter and lots
                    of beautiful memories. 💕</p>

                </div>
        </div>

        <!--card section-->
        <div class="row">

          <div class="col-4">
             <div class="detail-icon">📅</div>
             <small class="text-danger fw-semibold">
                DATE
             </small>
           
             <div>
                Oct 4
             </div>
          </div>

          <div class="col-4">
             <div class="detail-icon ">⏰</div>
             <small class="text-danger fw-semibold">
                TIME
             </small>
           
             <div>
                7:10
             </div>
          </div>

          <div class="col-4">
             <div class="detail-icon">📍</div>
             <small class="text-danger fw-semibold">
               PLACE 
             </small>
           
             <div>
               East Avenue
             </div>
          </div>

        </div>

         <!--celebrate section-->
        <div class="text-center mt-4">
           <div class="script-font text-danger fw-semibold ">
             <h1>Let's celebrate</h1>    
           </div>
           <div class="text-secondary">
            <p>Sunday, October 4, 2026, East Avenue</p>
        </div>
           
        </div>






    </div>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
