<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
       <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
           <div class="card border-0 shadow">
              <div class="card-header  text-center">
                <div class=" text-white bg-primary"> 
                    <h2 class="mb-1">Student Registration</h2>
                    <p class="mb-0">Please Fill In Your Details</p>
                </div>
                
                 <div class="card-body p-4 p-md-5">
                     <form>
                        <h5 class="text-primary mb-3">Personal Information</h5>

                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" placeholder="Enter first name" required>
                        </div> 
                        <div class="col-12 col-md-6">
                             <label class="form-label">Last Name</label>
                             <input type="text" class="form-control" placeholder="Enter Last Name" required>
                        </div>  
                        <div class="col-12 col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="student@example.com" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Date Of Birth</label>
                            <input type="date" class="form-control" placeholder="DD/MM/YYYY">
                        </div>
                        <div class="col-12 col-md-6">
                           <label class="form-label">Phone Number</label>
                           <input type="tel" class="form-control" placeholder="Enter Phone Number" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label d-block">Gender</label>
                                <div class="form-check form-check-inline">
                                    <input type="radio" name="gender"  class="form-check-input" required>
                                    <label class="form-check-label">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" name="gender"  class="form-check-input" required>
                                    <label class="form-check-label">Female</label>
                                </div>
                        </div>
                    </div>
                                   <h5 class="text-primary mb-3">Academic Information</h5>
                                   <div class="row g-3">
                                      <div class="col-12 col-md-6">
                                         <label class="form-label">Course</label>
                                         <select class="form-select" required>
                                             <option selected disabled>Select Course</option>

                                             <option>BCA</option>
                                             <option>B.Tech</option>
                                             <option>MCA</option>
                                             <option>MBA</option>
                                         </select>
                                      </div>
                                      <div class="col-12 col-md-6">
                                         <label class="form-label">Year</label>
                                         <select class="form-select">
                                            <option >Select year</option>

                                            <option>First Year</option>
                                            <option>Second Year</option>
                            0                <option>Third Year</option>
                                            <option>Last Year</option>
                                         </select>
                                      </div>
                                      <div class="col-12">
                                         <label class="form-label">Student ID</label>
                                         <input type="text" class="form-control" placeholder="Enter Student ID">
                                      </div>
                                   </div> 
                            <h5 class="text-primary mb-3">Address</h5>    
                            <div class="row g-3">
                               <div class="col-12">
                                  <label class="form-label">Address</label>
                                  <textarea rows="3" class="form-control" placeholder="Enter Your Address"></textarea>
  
                               </div>
                          
                           
                               <div class="col-md-4">
                                  <label class="form-label">City</label>
                                  <input type="text" class="form-control" placeholder="City">
                               </div>
                             
                            <div class="col-md-4">
                               <label class="form-label">State</label>
                               <input type="text" class="form-control" placeholder="State">

                            </div>      
                            <div class="col-md-4">
                                <label class="form-label">PIN Code</label>
                                <input type="text" class="form-control" placeholder="PIN Code">
                            </div>
                           
                            
                            </div>
                            <div class="form-check mt-4">
                                <input class="form-check-input" id="terms" required >
                                <label class="form-check-label">I agree to the terms and conditions.</label>
                            </div>   
                            <div class="d-grid d-md-flex gap-2 justify-content-md-end mt-4">

                                <button
                                    type="reset"
                                    class="btn btn-outline-secondary px-4">Reset</button>
                                <button type="submit" class="btn btn-primary px-4">Register</button>

                            </div>                
                </form>
                    
                 </div>
              </div>
           </div>
        </div>
       </div>
    </div>
</body>
</html>
