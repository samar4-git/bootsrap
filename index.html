<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
       <h1 class="text-primary text-center">Class 3 Timetable</h1><br><br>
       <div class="table-responsive table-bordered table-striped">
        <table class="table">
            <tr class="table-primary">
                <th class="table-info">Day & Time</th>
                <th>9:00 AM</th>
                <th class="table-primary">10:00 AM</th>
                <th class="table-primary">11:00 AM</th>
                <th class="table-primary">12:00 PM</th>
                <th class="table-primary">1:00 PM</th>
            </tr>
            <tr>
                <th class="table-primary">Monday</th>
                <td>Hindi</td>
                <td>English</td>
                <td>Lunch Break</td> 
                <td>T.R.L.</td>
                <td>Sport</td> 
            </tr>
            <tr>
                <th class="table-primary">Tuesday</th>
                <td>PA/VA</td>
                <td>PA/VA</td>
                <td>Lunch Break</td> 
                <td>English</td>
                <td>C.T.</td>
            </tr>
            <tr>
                <th class="table-primary">Wednesday</th>
                <td>WAU</td>
                <td>WAU</td>
                <td>Lunch Break</td> 
                <td>L.L.</td>
                <td>Math</td>
                
            </tr>
            <tr>
                <th class="table-primary">Thursday</th>
                <td>Club</td>
                <td>Hindi</td>
                <td>Lunch Break</td> 
                <td>Maths</td>
                <td>EE/CC</td>
                
            </tr>
            <tr>
                <th class="table-primary">Friday</th>
                <td>Arts</td>
                <td>Hindi</td>
                <td>Lunch Break</td>
                <td>English</td>
                <td>WAU</td>
            </tr>
        </table>
       </div>
    </div>
</body> 
</html>
